name: Validate synthetic examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: docker compose -f examples/docker-selenium/compose.yaml config --quiet
